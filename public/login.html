<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --cream: #F5F0E8;
      --ink: #1A1612;
      --gold: #C9A84C;
      --gold-light: #E8C97A;
      --muted: #8A7F74;
      --card-bg: #FDFAF4;
      --error: #C0392B;
      --success: #2E7D52;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'DM Sans', sans-serif;
      background-color: var(--cream);
      min-height: 100vh;
      display: grid;
      grid-template-columns: 1fr 1fr;
    }

    /* Grain texture */
    .grain {
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: 0.03;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
      background-size: 150px 150px;
      z-index: 100;
    }

    /* LEFT PANEL — decorative */
    .panel-left {
      background: var(--ink);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 48px;
      position: relative;
      overflow: hidden;
    }

    .panel-left::before {
      content: '';
      position: absolute;
      top: -100px;
      right: -100px;
      width: 400px;
      height: 400px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(201,168,76,0.18) 0%, transparent 70%);
    }

    .panel-left::after {
      content: '';
      position: absolute;
      bottom: -80px;
      left: -80px;
      width: 350px;
      height: 350px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(201,168,76,0.10) 0%, transparent 70%);
    }

    .panel-logo {
      font-family: 'Cormorant Garamond', serif;
      font-size: 22px;
      font-weight: 600;
      color: var(--gold);
      letter-spacing: 0.05em;
      text-transform: uppercase;
      z-index: 1;
    }

    .panel-copy {
      z-index: 1;
    }

    .panel-copy h2 {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(38px, 4vw, 58px);
      font-weight: 300;
      color: var(--cream);
      line-height: 1.1;
      margin-bottom: 20px;
    }

    .panel-copy h2 em {
      font-style: italic;
      color: var(--gold);
    }

    .panel-copy p {
      font-size: 14px;
      color: rgba(245,240,232,0.5);
      font-weight: 300;
      line-height: 1.7;
      max-width: 280px;
    }

    .panel-bottom {
      z-index: 1;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--gold); opacity: 0.4; }
    .dot.active { opacity: 1; width: 20px; border-radius: 3px; }

    /* RIGHT PANEL — form */
    .panel-right {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 48px;
      animation: slideIn 0.7s cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    @keyframes slideIn {
      from { opacity: 0; transform: translateX(40px); }
      to   { opacity: 1; transform: translateX(0); }
    }

    .form-wrap {
      width: 100%;
      max-width: 380px;
    }

    .form-header {
      margin-bottom: 48px;
    }

    .form-header .eyebrow {
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--gold);
      margin-bottom: 12px;
      display: block;
    }

    .form-header h1 {
      font-family: 'Cormorant Garamond', serif;
      font-size: 42px;
      font-weight: 400;
      color: var(--ink);
      line-height: 1.1;
    }

    .form-group {
      margin-bottom: 24px;
      position: relative;
    }

    label {
      display: block;
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 10px;
    }

    input {
      width: 100%;
      background: transparent;
      border: none;
      border-bottom: 1.5px solid rgba(26,22,18,0.18);
      padding: 12px 0;
      font-family: 'DM Sans', sans-serif;
      font-size: 15px;
      color: var(--ink);
      outline: none;
      transition: border-color 0.3s ease;
      letter-spacing: 0.01em;
    }

    input::placeholder { color: rgba(138,127,116,0.5); }

    input:focus { border-bottom-color: var(--gold); }

    .input-line {
      position: absolute;
      bottom: 0;
      left: 0;
      height: 1.5px;
      width: 0;
      background: var(--gold);
      transition: width 0.4s cubic-bezier(0.22, 1, 0.36, 1);
    }

    input:focus ~ .input-line { width: 100%; }

    .forgot {
      text-align: right;
      margin-top: -12px;
      margin-bottom: 24px;
    }

    .forgot a {
      font-size: 12px;
      color: var(--muted);
      text-decoration: none;
      transition: color 0.2s;
    }
    .forgot a:hover { color: var(--gold); }

    .btn-submit {
      width: 100%;
      background: var(--ink);
      color: var(--cream);
      border: none;
      padding: 17px;
      font-family: 'DM Sans', sans-serif;
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      cursor: pointer;
      border-radius: 2px;
      transition: all 0.35s cubic-bezier(0.22, 1, 0.36, 1);
      position: relative;
      overflow: hidden;
      margin-top: 8px;
    }

    .btn-submit::before {
      content: '';
      position: absolute;
      inset: 0;
      background: var(--gold);
      transform: translateX(-100%);
      transition: transform 0.4s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .btn-submit:hover::before { transform: translateX(0); }
    .btn-submit span { position: relative; z-index: 1; transition: color 0.35s; }
    .btn-submit:hover { box-shadow: 0 6px 30px rgba(201,168,76,0.3); }
    .btn-submit:hover span { color: var(--ink); }

    .btn-submit:disabled { opacity: 0.6; cursor: not-allowed; }
    .btn-submit:disabled::before { display: none; }

    .divider {
      display: flex;
      align-items: center;
      gap: 16px;
      margin: 32px 0;
    }

    .divider::before, .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: rgba(26,22,18,0.12);
    }

    .divider span {
      font-size: 11px;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .register-link {
      text-align: center;
      font-size: 13px;
      color: var(--muted);
    }

    .register-link a {
      color: var(--ink);
      font-weight: 500;
      text-decoration: none;
      border-bottom: 1px solid rgba(26,22,18,0.2);
      padding-bottom: 1px;
      transition: all 0.2s;
    }

    .register-link a:hover { border-color: var(--gold); color: var(--gold); }

    .toast {
      position: fixed;
      top: 28px;
      right: 28px;
      padding: 16px 24px;
      border-radius: 3px;
      font-size: 13px;
      font-weight: 400;
      z-index: 999;
      transform: translateY(-20px);
      opacity: 0;
      transition: all 0.4s cubic-bezier(0.22, 1, 0.36, 1);
      max-width: 320px;
      line-height: 1.5;
    }

    .toast.show { transform: translateY(0); opacity: 1; }
    .toast.success { background: var(--ink); color: var(--cream); border-left: 3px solid var(--gold); }
    .toast.error   { background: #2D1B1B; color: #F5D5D0; border-left: 3px solid var(--error); }

    /* Responsive */
    @media (max-width: 768px) {
      body { grid-template-columns: 1fr; }
      .panel-left { display: none; }
      .panel-right { padding: 40px 32px; }
    }
  </style>
</head>
<body>
  <div class="grain"></div>

  <!-- Left decorative panel -->
  <div class="panel-left">
    <div class="panel-logo">Auth&nbsp;System</div>
    <div class="panel-copy">
      <h2>Acesse sua<br><em>conta agora.</em></h2>
      <p>Uma experiência segura e elegante para gerenciar sua autenticação.</p>
    </div>
    <div class="panel-bottom">
      <div class="dot active"></div>
      <div class="dot"></div>
      <div class="dot"></div>
    </div>
  </div>

  <!-- Right form panel -->
  <div class="panel-right">
    <div class="form-wrap">
      <div class="form-header">
        <span class="eyebrow">Bem-vindo de volta</span>
        <h1>Entrar</h1>
      </div>

      <form id="loginForm" novalidate>
        <div class="form-group">
          <label for="email">Endereço de e-mail</label>
          <input type="email" id="email" placeholder="seu@email.com" required autocomplete="email" />
          <div class="input-line"></div>
        </div>

        <div class="form-group">
          <label for="password">Senha</label>
          <input type="password" id="password" placeholder="••••••••" required autocomplete="current-password" />
          <div class="input-line"></div>
        </div>

        <div class="forgot">
          <a href="#">Esqueceu a senha?</a>
        </div>

        <button type="submit" class="btn-submit" id="submitBtn">
          <span>Entrar na conta</span>
        </button>
      </form>

      <div class="divider"><span>ou</span></div>

      <p class="register-link">Ainda não tem conta? <a href="/register.html">Cadastre-se</a></p>
    </div>
  </div>

  <!-- Toast notification -->
  <div class="toast" id="toast"></div>

  <script>
    const form = document.getElementById("loginForm");
    const submitBtn = document.getElementById("submitBtn");
    const toast = document.getElementById("toast");

    function showToast(message, type = 'success') {
      toast.textContent = message;
      toast.className = `toast ${type} show`;
      setTimeout(() => toast.classList.remove('show'), 4000);
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();

      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      if (!email || !password) {
        showToast("Preencha todos os campos.", "error");
        return;
      }

      submitBtn.disabled = true;
      submitBtn.querySelector('span').textContent = 'Entrando…';

      try {
        const res = await fetch("/auth/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email, password }),
        });

        const data = await res.json();

        if (res.ok) {
          showToast("Login realizado com sucesso!", "success");
        } else {
          showToast(data.message || "Credenciais inválidas.", "error");
        }
      } catch (err) {
        showToast("Erro de conexão. Tente novamente.", "error");
      } finally {
        submitBtn.disabled = false;
        submitBtn.querySelector('span').textContent = 'Entrar na conta';
      }
    });
  </script>
</body>
</html>
